name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: "Proyecto 2 Oracle One/Coversor"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: "Proyecto 2 Oracle One/Coversor/pom.xml"
      - name: Build y tests
        run: mvn -B -ntp verify
